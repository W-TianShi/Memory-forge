
server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/memory_forge_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: ${MYSQL_PASSWORD:your_password_here}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5

  devtools:
    restart:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your_api_key_here}
    base-url: https://api.deepseek.com
    model: deepseek-chat
